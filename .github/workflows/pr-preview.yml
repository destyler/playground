name: PR Preview

on:
  pull_request:
    branches:
      - next
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Find preview comment
        id: preview-comment
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- destyler-pr-preview -->'
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
              response => response.data,
            )

            const comment = comments.find(candidate =>
              candidate.user?.login === 'github-actions[bot]' &&
              candidate.body?.includes(marker),
            )

            const body = comment?.body ?? ''
            const serviceId = body.match(/<!-- zeabur-service-id:([^\r\n]+?) -->/)?.[1]?.trim() ?? ''
            const previewUrl = body.match(/<!-- zeabur-preview-url:([^\r\n]+?) -->/)?.[1]?.trim() ?? ''

            core.setOutput('comment_id', comment?.id ?? '')
            core.setOutput('service_id', serviceId)
            core.setOutput('preview_url', previewUrl)
            core.setOutput('has_service', serviceId ? 'true' : 'false')

      - name: Validate Zeabur configuration
        if: github.event.action != 'closed' || steps.preview-comment.outputs.has_service == 'true'
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ vars.ZEABUR_PROJECT_ID }}
          ZEABUR_ENVIRONMENT_ID: ${{ vars.ZEABUR_ENVIRONMENT_ID }}
          PR_ACTION: ${{ github.event.action }}
          HAS_SERVICE: ${{ steps.preview-comment.outputs.has_service }}
        run: |
          test -n "$ZEABUR_TOKEN" || { echo 'ZEABUR_TOKEN is not configured'; exit 1; }
          if [ "$PR_ACTION" != 'closed' ]; then
            test -n "$ZEABUR_ENVIRONMENT_ID" || { echo 'ZEABUR_ENVIRONMENT_ID is not configured'; exit 1; }
          fi
          if [ "$PR_ACTION" != 'closed' ] && [ "$HAS_SERVICE" != 'true' ]; then
            test -n "$ZEABUR_PROJECT_ID" || { echo 'ZEABUR_PROJECT_ID is not configured'; exit 1; }
          fi

      - name: Checkout
        if: github.event.action != 'closed' || steps.preview-comment.outputs.has_service == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.event.pull_request.head.sha }}

      - name: Install pnpm
        if: github.event.action != 'closed' || steps.preview-comment.outputs.has_service == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Node
        if: github.event.action != 'closed' || steps.preview-comment.outputs.has_service == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: github.event.action != 'closed' || steps.preview-comment.outputs.has_service == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build playground
        if: github.event.action != 'closed'
        run: pnpm run build

      - name: Create preview archive
        if: github.event.action != 'closed'
        run: pnpm run preview:archive

      - name: Create preview service
        id: create
        if: github.event.action != 'closed' && steps.preview-comment.outputs.has_service != 'true'
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ vars.ZEABUR_PROJECT_ID }}
          ZEABUR_ENVIRONMENT_ID: ${{ vars.ZEABUR_ENVIRONMENT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm run preview:create

      - name: Update preview service
        id: update
        if: github.event.action != 'closed' && steps.preview-comment.outputs.has_service == 'true'
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ vars.ZEABUR_PROJECT_ID }}
          ZEABUR_ENVIRONMENT_ID: ${{ vars.ZEABUR_ENVIRONMENT_ID }}
          SERVICE_ID: ${{ steps.preview-comment.outputs.service_id }}
          DOMAIN: ${{ steps.preview-comment.outputs.preview_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm run preview:update

      - name: Resolve preview details
        id: preview
        if: github.event.action != 'closed'
        uses: actions/github-script@v8
        env:
          NEW_SERVICE_ID: ${{ steps.create.outputs.service_id || steps.update.outputs.service_id }}
          EXISTING_SERVICE_ID: ${{ steps.preview-comment.outputs.service_id }}
          NEW_PREVIEW_URL: ${{ steps.create.outputs.preview_url || steps.update.outputs.preview_url }}
          EXISTING_PREVIEW_URL: ${{ steps.preview-comment.outputs.preview_url }}
        with:
          script: |
            const serviceId = process.env.NEW_SERVICE_ID || process.env.EXISTING_SERVICE_ID
            const previewUrl = process.env.NEW_PREVIEW_URL || process.env.EXISTING_PREVIEW_URL

            if (!serviceId || !/^[A-Za-z0-9_-]+$/.test(serviceId)) {
              core.setFailed('The preview command did not return a valid service_id')
              return
            }

            try {
              const parsedUrl = new URL(previewUrl)
              if (!['http:', 'https:'].includes(parsedUrl.protocol))
                throw new Error('unsupported protocol')
            }
            catch {
              core.setFailed('The preview command did not return a valid preview_url')
              return
            }

            core.setOutput('service_id', serviceId)
            core.setOutput('preview_url', previewUrl)

      - name: Update active preview comment
        if: github.event.action != 'closed' && success()
        uses: actions/github-script@v8
        env:
          COMMENT_ID: ${{ steps.preview-comment.outputs.comment_id }}
          SERVICE_ID: ${{ steps.preview.outputs.service_id }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- destyler-pr-preview -->'
            const serviceId = process.env.SERVICE_ID
            const previewUrl = process.env.PREVIEW_URL
            const shortSha = process.env.HEAD_SHA.slice(0, 7)
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            const body = [
              marker,
              '<!-- zeabur-service-id:' + serviceId + ' -->',
              '<!-- zeabur-preview-url:' + previewUrl + ' -->',
              '## ✅ PR Preview is ready',
              '',
              `[打开预览](${previewUrl})`,
              '',
              `- Commit: \`${shortSha}\``,
              `- Service ID: \`${serviceId}\``,
              `- Updated: ${new Date().toISOString()}`,
              `- [GitHub Actions](${runUrl})`,
            ].join('\n')

            if (process.env.COMMENT_ID) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: Number(process.env.COMMENT_ID),
                body,
              })
            }
            else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

      - name: Delete preview service
        id: delete
        if: github.event.action == 'closed' && steps.preview-comment.outputs.has_service == 'true'
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ vars.ZEABUR_PROJECT_ID }}
          ZEABUR_ENVIRONMENT_ID: ${{ vars.ZEABUR_ENVIRONMENT_ID }}
          SERVICE_ID: ${{ steps.preview-comment.outputs.service_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm run preview:delete

      - name: Update closed preview comment
        if: github.event.action == 'closed' && success()
        uses: actions/github-script@v8
        env:
          COMMENT_ID: ${{ steps.preview-comment.outputs.comment_id }}
          HAD_SERVICE: ${{ steps.preview-comment.outputs.has_service }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- destyler-pr-preview -->'
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            const result = process.env.HAD_SERVICE === 'true'
              ? '已删除该 PR 的 Zeabur 预览服务。'
              : '该 PR 没有需要删除的预览服务。'
            const body = [
              marker,
              '## 🧹 PR Preview has been removed',
              '',
              result,
              '',
              `- Closed: ${new Date().toISOString()}`,
              `- [GitHub Actions](${runUrl})`,
            ].join('\n')

            if (process.env.COMMENT_ID) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: Number(process.env.COMMENT_ID),
                body,
              })
            }
            else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

      - name: Update preview failure comment
        if: failure()
        uses: actions/github-script@v8
        env:
          COMMENT_ID: ${{ steps.preview-comment.outputs.comment_id }}
          EXISTING_SERVICE_ID: ${{ steps.preview-comment.outputs.service_id }}
          EXISTING_PREVIEW_URL: ${{ steps.preview-comment.outputs.preview_url }}
          NEW_SERVICE_ID: ${{ steps.create.outputs.service_id || steps.update.outputs.service_id }}
          NEW_PREVIEW_URL: ${{ steps.create.outputs.preview_url || steps.update.outputs.preview_url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- destyler-pr-preview -->'
            const serviceId = process.env.NEW_SERVICE_ID || process.env.EXISTING_SERVICE_ID
            const previewUrl = process.env.NEW_PREVIEW_URL || process.env.EXISTING_PREVIEW_URL
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            const operation = context.payload.action === 'closed' ? '删除' : '部署'
            const metadata = [marker]

            if (serviceId)
              metadata.push('<!-- zeabur-service-id:' + serviceId + ' -->')
            if (previewUrl)
              metadata.push('<!-- zeabur-preview-url:' + previewUrl + ' -->')

            const body = [
              ...metadata,
              '## ❌ PR Preview failed',
              '',
              `Zeabur 预览服务${operation}失败。`,
              '',
              `请查看 [GitHub Actions](${runUrl}) 了解详情。`,
            ].join('\n')

            if (process.env.COMMENT_ID) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: Number(process.env.COMMENT_ID),
                body,
              })
            }
            else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
